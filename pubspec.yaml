name: split_expense
description: "Managing group expenses made easy."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

# Only bump the name part (eg: 1.2.0) before a release.
# The version code (the +N suffix) is overwritten automatically by CI.
version: 1.2.4+34

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  chips_choice: ^3.0.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  # Pinned below 3.0.0: that release migrates the widget to material_ui
  # instead of package:flutter/material.dart, which this app doesn't use.
  flutter_expandable_fab: ^2.5.2
  flutter_launcher_icons: ^0.14.4
  http: ^1.2.2
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  provider: ^6.1.2
  share_plus: ^13.3.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  onesignal_flutter: ^5.6.11
  firebase_core: ^4.15.0
  qr_flutter: ^4.1.0
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/split.webp"
  min_sdk_android: 21 # android min sdk min:16, default 21
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
