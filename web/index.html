<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Managing group expenses made easy.">

  <!-- Browser UI colour: AppTheme's surface in each brightness. -->
  <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151218" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Split">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Split</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame (flutter_bootstrap.js
       removes it), so a cold load isn't a blank page while the engine
       downloads. Colours match AppTheme's surface. */
    html, body { margin: 0; height: 100%; background: #fef7ff; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fef7ff;
      transition: opacity 200ms ease-out;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #151218; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Split">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
