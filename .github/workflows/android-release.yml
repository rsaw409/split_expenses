name: Android Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Sign
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.0.3
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.STOREPASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYPASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYALIAS }}" >> android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set build version code from run number
        id: version
        run: |
          version_name=$(grep -m1 '^version:[[:space:]]*[0-9]' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d '+' -f1)
          if [ -z "$version_name" ]; then
            echo "::error::Could not parse 'version: X.Y.Z' from pubspec.yaml. Keep it on a single line."
            exit 1
          fi
          sed -i "s/^version:.*/version: ${version_name}+${{ github.run_number }}/" pubspec.yaml
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Start Android Release Build
        run: flutter build appbundle

      # The .aab is what Play wants; the .apk is for the GitHub release, since
      # an app bundle can't be installed on a device directly.
      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # No Apple signing identity is configured, so this is an unsigned build:
      # it has to be re-signed (e.g. AltStore/Sideloadly) before it installs.
      - name: Build iOS app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry app-release-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-release-unsigned.ipa

  deploy:
    name: Deploy Android Build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Get Android Build from artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Release Build to production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: developer.rohitsaw.split
          releaseFiles: app-release.aab
          track: production
          status: completed

  github-release:
    name: Publish GitHub Release
    needs: [build, build-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name release files
        run: |
          base="split-${{ needs.build.outputs.version_name }}-${{ github.run_number }}"
          mv dist/app-release.apk "dist/${base}.apk"
          mv dist/app-release.aab "dist/${base}.aab"
          mv dist/app-release-unsigned.ipa "dist/${base}-unsigned.ipa"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}-build${{ github.run_number }}
          name: v${{ needs.build.outputs.version_name }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
