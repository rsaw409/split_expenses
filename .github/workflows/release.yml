name: Release

# Stages: check -> build (android, ios, web) -> publish (android, ios, web) and GitHub release, in parallel.
# Publishing and the GitHub release only run on pushes to main.

# Play's version code is the run number plus this offset. The run number
# restarts at 1 whenever this file is renamed (it was android-release.yml,
# last run #70), and Play rejects a version code that doesn't increase, so bump
# this past the old workflow's final run number on any future rename.
env:
  VERSION_CODE_OFFSET: 100
  FLUTTER_VERSION: "3.44.9"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The web build compiles code that imports dart:io, but `Platform` throws
      # there at runtime (that crashed the drawer), so this has to be caught
      # here. Use kIsWeb / defaultTargetPlatform from flutter/foundation.dart.
      - name: Check lib/ is web-safe
        run: |
          if grep -rn "import 'dart:io'" lib/; then
            echo "::error::lib/ imports dart:io, whose Platform throws on web. Use kIsWeb / defaultTargetPlatform (flutter/foundation.dart) instead."
            exit 1
          fi

      - name: Run tests
        run: flutter test

      # Only the version name in pubspec.yaml is maintained by hand; the build
      # number committed there is ignored and replaced by this one.
      - name: Compute version
        id: version
        run: |
          version_name=$(grep -m1 '^version:[[:space:]]*[0-9]' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d '+' -f1)
          if [ -z "$version_name" ]; then
            echo "::error::Could not parse 'version: X.Y.Z' from pubspec.yaml. Keep it on a single line."
            exit 1
          fi
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=$(( ${{ github.run_number }} + VERSION_CODE_OFFSET ))" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Whitespace is stripped first because GNU base64 rejects the CR/spaces a
      # pasted secret may carry, which the previous Node-based action ignored.
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "${{ secrets.STOREPASSWORD }}" > /dev/null
      - name: Create key.properties
        run: |
          echo "storeFile=$RUNNER_TEMP/upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STOREPASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYPASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYALIAS }}" >> android/key.properties
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Obfuscated, with Dart symbols split out: needed to read the bundle's
      # stack traces with `flutter symbolize -i crash.txt -d app.android-arm64.symbols`.
      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
          --build-name=${{ needs.check.outputs.version_name }}
          --build-number=${{ needs.check.outputs.build_number }}

      # The .aab is what Play wants; the .apk is for the GitHub release, since
      # an app bundle can't be installed on a device directly.
      - name: Build APK
        run: >-
          flutter build apk --release
          --build-name=${{ needs.check.outputs.version_name }}
          --build-number=${{ needs.check.outputs.build_number }}

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # To read an obfuscated stack trace from a Play build, unzip that
      # release's symbols and run:
      #   flutter symbolize -i crash.txt -d app.android-arm64.symbols
      - name: Upload Dart symbols
        uses: actions/upload-artifact@v7
        with:
          name: android-symbols
          path: build/symbols

  build-ios:
    name: Build iOS (unsigned)
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # No Apple signing identity is configured, so this is an unsigned build:
      # it has to be re-signed (e.g. AltStore/Sideloadly) before it installs.
      - name: Build iOS app
        run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.check.outputs.version_name }}
          --build-number=${{ needs.check.outputs.build_number }}

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry app-release-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: app-release-unsigned.ipa

  build-web:
    name: Build Web
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Served from the root of its own origin (base href "/"); a subpath
      # needs --base-href=/path/ here. The version lands in version.json,
      # which the About dialog reads on web.
      - name: Build web app
        run: >-
          flutter build web --release --no-wasm-dry-run
          --build-name=${{ needs.check.outputs.version_name }}
          --build-number=${{ needs.check.outputs.build_number }}

      # Changing sw.js on every deploy makes browsers install the new worker,
      # which refreshes its precached files (see web/sw.js). Fails rather than
      # skips if the placeholder is gone, which would silently stop that.
      - name: Stamp service worker
        run: |
          stamp="${{ needs.check.outputs.version_name }}+${{ needs.check.outputs.build_number }}"
          if ! grep -q "^const BUILD = 'dev';$" build/web/sw.js; then
            echo "::error::web/sw.js no longer has the line \"const BUILD = 'dev';\" for CI to stamp."
            exit 1
          fi
          sed -i "s/^const BUILD = 'dev';$/const BUILD = '${stamp}';/" build/web/sw.js
          grep -n "^const BUILD" build/web/sw.js

      - name: Package web app
        run: cd build/web && zip -qr "$GITHUB_WORKSPACE/split-web.zip" .

      - name: Upload web app
        uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: split-web.zip

  publish-android:
    name: Publish Android (Play Store)
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Download app bundle
        uses: actions/download-artifact@v8
        with:
          name: android-aab
      - name: Release to production track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: developer.rohitsaw.split
          releaseFiles: app-release.aab
          tracks: production
          status: completed

  # Placeholder: App Store publishing isn't supported yet (needs Apple signing
  # and App Store Connect credentials). Replace the step below when it is.
  publish-ios:
    name: Publish iOS (App Store)
    needs: build-ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "::notice::iOS publishing is not supported yet; the unsigned IPA is attached to the GitHub release only."

  # Render serves the web app (split.rsaw409.me) as a static site from the
  # web-release branch, publish directory "public", and redeploys on every push
  # to it. Each deploy force-pushes one commit holding only the latest build,
  # so the branch never accumulates build history; every build stays attached
  # to its GitHub release. Render's side (rewrite, headers, domain) is set in
  # its dashboard, see CLAUDE.md.
  publish-web:
    name: Publish Web (Render)
    needs: [check, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-web
      cancel-in-progress: false
    steps:
      - name: Download web app
        uses: actions/download-artifact@v8
        with:
          name: web-zip

      # Builds from consecutive pushes run in parallel, so an older run can
      # reach this step last; it must not replace a newer deploy. To roll back,
      # revert on main and let the fix roll forward.
      - name: Push build to web-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.check.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
        run: |
          mkdir deploy && cd deploy
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch -q --depth=1 origin web-release 2>/dev/null; then
            deployed=$(git show FETCH_HEAD:public/version.json 2>/dev/null | jq -r '.build_number // 0' || echo 0)
            if [ "${deployed:-0}" -ge "$BUILD_NUMBER" ]; then
              echo "::notice::web-release already has build ${deployed}; not replacing it with build ${BUILD_NUMBER}."
              exit 0
            fi
          fi

          git checkout -q --orphan web-release
          unzip -q ../split-web.zip -d public
          cat > README.md <<EOF
          # web-release

          Generated by the Release workflow; do not edit. Render serves \`public/\`
          at https://split.rsaw409.me, and each push to this branch redeploys it.

          Build ${VERSION_NAME}+${BUILD_NUMBER}, from ${GITHUB_SHA}.
          EOF
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Web build ${VERSION_NAME}+${BUILD_NUMBER} from ${GITHUB_SHA}"
          git push -q --force origin web-release
          echo "::notice::Deployed web build ${VERSION_NAME}+${BUILD_NUMBER} to web-release."

  github-release:
    name: GitHub Release
    needs: [check, build-android, build-ios, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Name release files
        run: |
          base="split-${{ needs.check.outputs.version_name }}-${{ needs.check.outputs.build_number }}"
          mv dist/app-release.apk "dist/${base}.apk"
          mv dist/app-release.aab "dist/${base}.aab"
          mv dist/app-release-unsigned.ipa "dist/${base}-unsigned.ipa"
          mv dist/split-web.zip "dist/${base}-web.zip"
          # Workflow artifacts expire, so the release keeps the AAB's symbols.
          (cd dist && zip -qm "${base}-aab-symbols.zip" *.symbols)

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version_name }}-build${{ needs.check.outputs.build_number }}
          name: v${{ needs.check.outputs.version_name }} (build ${{ needs.check.outputs.build_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
